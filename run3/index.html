<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Run 3</title>
  <style>
    :root {
      --bg-1: #020a17;
      --bg-2: #0e1c33;
      --panel: rgba(8, 14, 26, 0.38);
      --line: rgba(125, 224, 255, 0.46);
      --cyan: #7fe7ff;
      --purple: #b98eff;
      --pink: #ff7dd8;
      --text: #ecf8ff;
      --muted: #b9d0ea;
      --start: #8ee4ff;
      --button: rgba(255,255,255,0.12);
      --blue: #5c8de9;
      --blue-strong: #3e73d9;
      --dark: #010d1d;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #02060f;
      color: var(--text);
      font-family: Inter, system-ui, sans-serif;
      padding: 26px;
    }

    .shell {
      width: min(1220px, 100%);
      background: linear-gradient(90deg, rgba(27,49,87,0.94), rgba(28,63,124,0.92));
      border: 1px solid rgba(77, 133, 255, 0.8);
      border-radius: 26px;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.38);
      overflow: hidden;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      padding: 18px 20px 16px;
      border-bottom: 1px solid rgba(143, 217, 255, 0.38);
      background: rgba(5, 16, 30, 0.24);
      backdrop-filter: blur(8px);
    }

    .title {
      margin: 0;
      font-size: clamp(2.0rem, 3vw, 3rem);
      font-weight: 900;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--cyan);
      text-shadow: 0 0 18px rgba(127, 231, 255, 0.5);
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    button {
      border: none;
      border-radius: 999px;
      padding: 12px 20px;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s ease, filter 0.2s ease;
      min-width: 110px;
    }

    button:hover { transform: translateY(-1px); filter: brightness(1.06); }

    .primary {
      background: linear-gradient(135deg, #8fe5ff, #b6d2ff);
      color: #071b2a;
      box-shadow: 0 8px 18px rgba(143, 229, 255, 0.25);
    }

    .secondary {
      background: rgba(255,255,255,0.08);
      color: var(--text);
      border: 1px solid rgba(255,255,255,0.12);
    }

    .game-wrap {
      padding: 18px 18px 14px;
    }

    canvas {
      display: block;
      width: 100%;
      height: auto;
      max-width: 100%;
      background: linear-gradient(180deg, #5b8ce8, #4c79d5);
      border-radius: 20px;
      border: 1px solid rgba(255,255,255,0.12);
      box-shadow: inset 0 0 24px rgba(18, 48, 87, 0.15);
    }

    .hud {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 14px;
      margin-top: 14px;
      color: var(--muted);
      flex-wrap: wrap;
    }

    .status {
      font-weight: 700;
      color: var(--cyan);
    }

    .readout {
      display: flex;
      gap: 18px;
      flex-wrap: wrap;
    }

    @media (max-width: 700px) {
      .topbar { flex-direction: column; align-items: flex-start; }
      .hud { flex-direction: column; align-items: flex-start; }
    }
  </style>
</head>
<body>
  <div class="shell">
    <div class="topbar">
      <h1 class="title">Run 3</h1>
      <div class="actions">
        <button id="startBtn" class="primary">Start</button>
        <button id="resetBtn" class="secondary">Reset</button>
        <button class="secondary" onclick="window.location.href='../'">Back</button>
      </div>
    </div>

    <div class="game-wrap">
      <canvas id="gameCanvas" width="900" height="420"></canvas>

      <div class="hud">
        <div class="status" id="statusText">Ready to run</div>
        <div class="readout">
          <div>Score: <strong id="scoreText">0</strong></div>
          <div>Best: <strong id="bestText">0</strong></div>
          <div>Speed: <strong id="speedText">1.0x</strong></div>
        </div>
      </div>
    </div>
  </div>

  <script src="./main.js"></script>
</body>
</html>
